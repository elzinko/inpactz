# secrets.yaml — manifeste des secrets d'inpactz. NOMS + RÔLES seulement, JAMAIS de valeurs.
#
# Source unique des valeurs = le trousseau macOS (via `ezk-secret`). Ce fichier est
# VERSIONNÉ : il voyage dans chaque worktree, sans copier aucun `.env`.
# Il est INERTE : il ne pousse rien. `scripts/deploy-vercel.sh` lit les valeurs au
# trousseau (tu autorises par Touch ID) au moment de déployer, sans les afficher.
#
# Destinations (`to:`) : github (CI) · vercel:<env> · local (.env de ce worktree) · (aucune) = lu à la demande.
# Nom au trousseau : « inpactz-<nom-kebab> » par défaut ; `from:` pour un secret partagé au niveau COMPTE.

project: inpactz

secrets:

  # ── Vercel (déploiement de l'appli app/) ───────────────────────────────────
  # Jeton Vercel partagé au niveau COMPTE (le même que muti). Lu à la demande par
  # scripts/deploy-vercel.sh → pas de destination à pousser.
  VERCEL_TOKEN:
    role: "Jeton Vercel — déploiement de l'appli depuis le poste"
    from: VERCEL_TOKEN
  # Identifiants d'organisation et de projet : pas sensibles. Le premier déploiement
  # les écrit dans .vercel/project.json (gitignoré) ; on peut aussi les ranger au
  # trousseau (`ezk-secret set inpactz-vercel-org-id`) pour les retrouver dans un
  # autre worktree.
  VERCEL_ORG_ID:
    role: "Organisation (équipe) Vercel qui héberge inpactz"
    kind: variable
  VERCEL_PROJECT_ID:
    role: "Projet Vercel inpactz"
    kind: variable
