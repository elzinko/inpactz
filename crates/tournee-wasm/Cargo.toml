[package]
name = "tournee-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Moteur de tournée PAV compilé en WebAssembly pour l'appli (navigateur, Android)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
tournee-core = { path = "../tournee-core", default-features = false }
wasm-bindgen = "=0.2.100"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
