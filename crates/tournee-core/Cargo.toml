[package]
name = "tournee-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Moteur de tournée PAV : lecture des fiches, géocodage BAN, ordre de passage, export Excel"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["time", "process", "fs"] }
vrp-pragmatic = "1.25.0"
vrp-core = "1.25.0"
rust_xlsxwriter = "0.104"
pdf-extract = "0.12"
regex = "1"
once_cell = "1"
tempfile = "3"
urlencoding = "2"
unicode-normalization = "0.1"
